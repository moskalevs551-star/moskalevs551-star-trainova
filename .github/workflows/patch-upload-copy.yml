name: Patch Trainova upload copy

on:
  push:
    branches:
      - feature/import-trainova-source

permissions:
  contents: write

jobs:
  patch-upload-copy:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: feature/trainova-reference-redesign
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch upload page copy
        run: |
          git fetch origin "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/testflow/pages.tsx')
          text = path.read_text(encoding='utf-8-sig')
          if 'accept=".qst,.txt,.zip,text/plain,application/zip,application/x-zip-compressed"' not in text:
              text = text.replace('''              onChange={handleFileInputChange}\n              ref={inputRef}\n              type="file"''', '''              onChange={handleFileInputChange}\n              ref={inputRef}\n              accept=".qst,.txt,.zip,text/plain,application/zip,application/x-zip-compressed"\n              type="file"''')
          guest_copy = '''              <p className="mt-2 max-w-sm text-sm leading-6 text-[#586380] dark:text-[#c7cce0]">\n                Можно пройти без аккаунта. Войдите, когда захотите сохранить прогресс в облаке.\n              </p>\n'''
          if 'Можно пройти без аккаунта. Войдите, когда захотите сохранить прогресс в облаке.' not in text:
              text = text.replace('''              <p className="mt-3 max-w-sm text-base leading-7 text-[#586380] dark:text-[#c7cce0]">\n                Поддерживаются .qst, .txt и .zip. На телефоне откройте «Файлы» или «Проводник».\n              </p>\n''', '''              <p className="mt-3 max-w-sm text-base leading-7 text-[#586380] dark:text-[#c7cce0]">\n                Поддерживаются .qst, .txt и .zip. На телефоне откройте «Файлы» или «Проводник».\n              </p>\n''' + guest_copy)
          path.write_text(text, encoding='utf-8')
          PY
          git add src/components/testflow/pages.tsx
          git status --short
          git commit -m "Clarify guest mobile upload flow" || echo "No upload copy changes"
          git push origin "$TARGET_BRANCH"
