name: Import full Trainova source

on:
  push:
    branches:
      - feature/full-trainova-project

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-trainova-project
          persist-credentials: true

      - name: Download prepared source archive
        run: |
          curl -fL https://trainova.vercel.app/trainova-source.tar.gz -o /tmp/trainova-source.tar.gz

      - name: Replace repository contents with Trainova project
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/trainova-source.tar.gz -C .
          rm -f public/trainova-source.tar.gz

      - name: Commit full project source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Add full Trainova project source"
            git push origin feature/full-trainova-project
          fi
