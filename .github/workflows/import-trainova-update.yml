name: Import Trainova session and test update

on:
  push:
    branches:
      - feature/full-trainova-project
    paths:
      - .github/workflows/import-trainova-update.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-trainova-project
          fetch-depth: 0

      - name: Download prepared source archive
        run: |
          curl -fsSL https://trainova.vercel.app/trainova-update-source.tar.gz -o /tmp/trainova-update-source.tar.gz
          mkdir -p /tmp/trainova-source
          tar -xzf /tmp/trainova-update-source.tar.gz -C /tmp/trainova-source

      - name: Replace repository contents with Trainova project
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/trainova-source/. .
          rm -f public/trainova-update-source.tar.gz public/trainova-source.tar.gz
          rm -f .github/workflows/import-trainova-update.yml

      - name: Guard against forbidden content
        run: |
          test -f package.json
          test -d src
          test -f supabase/migrations/0001_testflow_schema.sql
          test -f tailwind.config.ts
          test ! -e .env
          test ! -e .env.local
          test ! -e .env.production
          test ! -e .vercel
          test ! -e node_modules
          test ! -e .next
          test ! -e public/trainova-update-source.tar.gz
          if grep -RInE 'codex|SUPABASE_SERVICE_ROLE_KEY|GOOGLE_CLIENT_SECRET|Google Client Secret|client_secret\s*[:=]|service_role|supabase_secret|sk_live_|ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+' --exclude-dir=.git --exclude-dir=node_modules .; then
            echo 'Forbidden content found'
            exit 1
          fi

      - name: Commit full project source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Trainova session domain and test modes"
          git push origin HEAD:feature/full-trainova-project
