name: Import Trainova critical fix

on:
  push:
    paths:
      - .github/workflows/import-trainova-critical-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-trainova-project
          fetch-depth: 0

      - name: Download source archive
        run: |
          set -euo pipefail
          curl -fsSL https://trainova.vercel.app/trainova-fix-source.tar.gz -o /tmp/trainova-fix-source.tar.gz
          mkdir -p /tmp/trainova-src
          tar -xzf /tmp/trainova-fix-source.tar.gz -C /tmp/trainova-src

      - name: Replace branch contents
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/trainova-src/. .
          rm -f public/trainova-fix-source.tar.gz
          rm -f .github/workflows/import-trainova-critical-fix.yml

      - name: Guard archive contents
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e .env.local
          test ! -e .env.production
          test ! -d .vercel
          test ! -d node_modules
          test ! -d .next
          test -e package.json
          test -d src
          test -e supabase/migrations/0001_testflow_schema.sql
          ! grep -R -I -n -E 'codex-build|codex-build-web-apps-plugin-build|SUPABASE_SERVICE_ROLE_KEY|Google Client Secret|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY' .

      - name: Commit imported project
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Fix Trainova text auth guest upload and dark theme" || exit 0
          git push origin HEAD:feature/full-trainova-project
